version: 2

models:
  - name: mart_historic_product
    description: product-level reference data used to describe the products associated with business activity.
    columns:
      - name: product_id
        description: unique identifier for the product.
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - product_id
                  - product_loaded_at
              config:
                severity: warn
          - not_null:
              config:
                severity: error
      - name: product_name
        description: business name of the product.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: product_loaded_at
        description: timestamp when the product record was loaded into the platform.
        data_tests:
          - not_null:
              config:
                severity: error
