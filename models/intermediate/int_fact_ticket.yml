version: 2

models:
  - name: int_fact_ticket
    description: ticket-level intermediate fact model that standardizes support ticket attributes, dimensional foreign keys, lifecycle dates, SLA indicators, and response and resolution timing metrics.
    columns:
      - name: ticket_id
        description: unique identifier for the support ticket.
        data_tests:
          - not_null:
              config:
                severity: error

      - name: ticket_customer_id
        description: identifier for the customer associated with the ticket.
        data_tests:
          - not_null:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('int_customer')
                field: customer_id
              config:
                severity: error

      - name: ticket_account_id
        description: identifier for the account associated with the ticket.
        data_tests:
          - not_null:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('int_account')
                field: account_id
              config:
                severity: error

      - name: ticket_product_id
        description: identifier for the product associated with the ticket.
        data_tests:
          - not_null:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('int_product')
                field: product_id
              config:
               severity: error

      - name: ticket_category_id
        description: identifier for the category associated with the ticket.
        data_tests:
          - relationships:
              arguments:
                to: ref('int_category')
                field: category_id
              config:
                severity: warn
                where: "ticket_category_id is not null"

      - name: ticket_region_id
        description: identifier for the region associated with the ticket.
        data_tests:
          - relationships:
              arguments:
                to: ref('int_region')
                field: region_id
              config:
                severity: warn
                where: "ticket_region_id is not null"

      - name: ticket_channel_id
        description: identifier for the channel through which the ticket was created.
        data_tests:
          - relationships:
              arguments:
                to: ref('int_channel')
                field: channel_id
              config:
                severity: warn
                where: "ticket_channel_id is not null"

      - name: ticket_priority_id
        description: identifier for the priority assigned to the ticket.
        data_tests:
          - not_null:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('int_priority')
                field: priority_id
              config:
                severity: error

      - name: ticket_status_id
        description: identifier for the current status assigned to the ticket.
        data_tests:
          - not_null:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('int_status')
                field: status_id
              config:
                severity: error

      - name: ticket_agent_id
        description: identifier for the agent assigned to the ticket.
        data_tests:
          - relationships:
              arguments:
                to: ref('int_agent')
                field: agent_id
              config:
                severity: warn
                where: "ticket_agent_id is not null" 

      - name: ticket_issue_description
        description: free-text description of the issue reported in the ticket.

      - name: ticket_resolution_notes
        description: free-text notes describing how the ticket was resolved.

      - name: ticket_first_response_time_hours
        description: elapsed time in fractional hours between ticket creation and first response.

      - name: ticket_first_response_time_minutes
        description: elapsed time in minutes between ticket creation and first response.

      - name: ticket_first_response_time_seconds
        description: elapsed time in seconds between ticket creation and first response.

      - name: ticket_resolution_time_hours
        description: elapsed time in fractional hours between ticket creation and resolution.

      - name: ticket_resolution_time_minutes
        description: elapsed time in minutes between ticket creation and resolution.

      - name: ticket_resolution_time_seconds
        description: elapsed time in seconds between ticket creation and resolution.

      - name: ticket_created_date
        description: calendar date when the ticket was created.
        data_tests:
          - not_null

      - name: ticket_resolved_date
        description: calendar date when the ticket was resolved.

      - name: ticket_escalated
        description: indicates whether the ticket was escalated during its lifecycle.
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
              config:
                severity: warn
                where: "ticket_escalated is not null"

      - name: ticket_sla_breached
        description: indicates whether the ticket breached its SLA target.
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
              config:
                severity: warn
                where: "ticket_sla_breached is not null"

      - name: ticket_issue_complexity_score
        description: numeric score representing the estimated complexity of the issue.

      - name: ticket_customer_satisfaction_score
        description: numeric customer satisfaction score captured for the ticket.

      - name: ticket_previous_tickets
        description: number of prior tickets associated with the same customer or account context.

      - name: ticket_loaded_at
        description: timestamp when the ticket record was loaded into the platform.
        data_tests:
          - not_null:
              config:
                severity: error
