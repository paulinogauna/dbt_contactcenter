version: 2

models:
  - name: int_account
    description: account-level reference data used to describe each customer account and its subscription, payment, and regional attributes.
    columns:
      - name: account_id
        description: unique identifier for the account.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: account_name
        description: business name associated with the account.
        data_tests:
          - not_null:
              config:
                severity: error
      - name: account_segment
        description: business segment the account belongs to.
        data_tests:
          - relationships:
              arguments:
                field: account_segment
                to: ref('Account_Segments')
              config:
                severity: warn
                where: "account_segment IS NOT NULL"
      - name: account_subscription_type
        description: subscription plan or service tier assigned to the account.
        data_tests:
          - relationships:
              arguments:
                field: account_subscription_type
                to: ref('Subscription_Type')
              config:
                severity: warn
                where: "account_subscription_type IS NOT NULL"
      - name: account_payment_method
        description: payment method the account uses for billing.
        data_tests:
          - relationships:
              arguments:
                field: account_payment_method
                to: ref('payment_method')
              config:
                severity: warn
                where: "account_payment_method IS NOT NULL"
      - name: account_region_id
        description: identifier for the region associated with the account.
        data_tests:
          - not_null:
              config:
                severity: error
          - relationships:
              arguments:
                field: region_id
                to: ref('int_region')
              config:
                severity: error
      - name: account_loaded_at
        description: timestamp when the account record was loaded into the platform.
        data_tests:
          - not_null:
              config:
                severity: error
