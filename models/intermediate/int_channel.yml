version: 2

models:
  - name: int_channel
    description: channel-level reference data used to describe the business channel through which interactions occur.
    columns:
      - name: channel_id
        description: unique identifier for the channel.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: channel_name
        description: business name of the channel.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: channel_loaded_at
        description: timestamp when the channel record was loaded into the platform.
        data_tests:
          - not_null:
              config:
                severity: error
